<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Linefact – Live-Standort</title>
<meta property="og:title" content="Linefact – Live-Standort">
<meta property="og:description" content="Sieh live, wo gerade gefahren wird.">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{color-scheme:light;--page:#F2F3EF;--card:#fff;--ink:#121418;--ink2:#5C636B;--line:#E3E4DF;--accent:#1E50FF}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--page:#0E0F11;--card:#17191D;--ink:#F0F1F2;--ink2:#B9BDC3;--line:#2A2D33;--accent:#5B7FFF}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 36px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.3rem;margin-bottom:14px}
.brand small{margin-left:auto;font-size:.8rem;font-weight:600;color:var(--ink2)}
.logo{width:34px;height:34px;border-radius:9px;background:#1E50FF;display:grid;place-items:center;overflow:hidden}.logo svg{width:100%;height:100%}
#map{height:58vh;min-height:300px;border-radius:20px;overflow:hidden;background:#E8EAE3;border:1px solid var(--line)}
h1{font-size:1.5rem;margin:16px 0 2px;line-height:1.2}
.sub{color:var(--ink2);margin:0}
.warn{margin-top:12px;border-radius:14px;padding:10px 12px;font-weight:700;background:#FFF4E5;color:#9A5B00}
.off{margin-top:12px;border-radius:14px;padding:10px 12px;font-weight:600;background:rgba(127,127,127,.12);color:var(--ink2)}
.note{color:var(--ink2);font-size:.86rem;margin-top:14px}
.dot{width:20px;height:20px;border-radius:50%;background:#1E50FF;border:3px solid #fff;box-shadow:0 0 0 8px rgba(30,80,255,.18),0 1px 4px rgba(0,0,0,.3)}
.dot.old{background:#8A929C;box-shadow:0 0 0 8px rgba(138,146,156,.2)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<div class="brand"><span class="logo"><svg viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="2.2"><path d="M50 16 C71 14 86 30 84 51 C82 72 65 86 46 84 C25 82 14 65 18 46 C21 29 33 17 50 16 Z" stroke-opacity=".18"/><path d="M50 29 C64 28 73 38 72 51 C71 63 61 72 48 71 C35 70 28 61 30 48 C32 37 40 30 50 29 Z" stroke-opacity=".27"/><path d="M50 41 C56 41 60 45 60 50 C60 56 55 60 49 59 C44 58 41 54 42 49 C43 44 46 41 50 41 Z" stroke-opacity=".38"/></g><path d="M21 79 79 21" stroke="#fff" stroke-width="8.5" stroke-linecap="round"/><circle cx="50" cy="50" r="5.4" fill="#121418"/></svg></span>
Linefact<small id="lvTag">Live</small></div>
<div id="map" role="img" aria-label="Karte"></div>
<h1 id="lvTitle">…</h1>
<p class="sub" id="lvSub"></p>
<div class="warn" id="lvStill" hidden></div>
<div class="off" id="lvOld" hidden></div>
<p class="note" id="lvNote"></p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function(){
var SB='https://pgkkbzozlufbzcdtkbrb.supabase.co',KEY='sb_publishable_oizBlM6hGJoDkOjSbtd9Aw_ydfWCJRb';
var EN=!/^de/i.test(navigator.language||'de');
var TX=EN?{rider:'Rider',on:'{0} is riding',off:'{0} is not riding right now',offNote:'The location only appears while a ride is being recorded.',bad:'This link is not valid (anymore).',badNote:'Ask for a new link.',since:'since {0}',last:'last location {0}',ago:function(s){return s<10?'just now':s<60?s+' s ago':s<3600?Math.round(s/60)+' min ago':Math.floor(s/3600)+' h ago'},still:'Stationary for {0} min',noNet:'Last location {0} min ago – probably no signal',mode:{mx:'Motocross',race:'Enduro Race',enduro:'Enduro',sm:'Supermoto'},note:'Linefact is not an emergency system. Without signal or battery no location is sent. In an emergency, call your local emergency number (112 in Europe).',map:'Map',err:'Connection problem – trying again …'}
:{rider:'Fahrer',on:'{0} fährt gerade',off:'{0} fährt gerade nicht',offNote:'Der Standort erscheint nur, während eine Fahrt aufgezeichnet wird.',bad:'Dieser Link ist nicht (mehr) gültig.',badNote:'Frag nach einem neuen Link.',since:'seit {0}',last:'letzter Standort {0}',ago:function(s){return s<10?'gerade eben':s<60?'vor '+s+' s':s<3600?'vor '+Math.round(s/60)+' Min.':'vor '+Math.floor(s/3600)+' Std.'},still:'Steht seit {0} Min. still',noNet:'Letzter Standort vor {0} Min. – vermutlich kein Netz',mode:{mx:'Motocross',race:'Enduro Race',enduro:'Enduro',sm:'Supermoto'},note:'Linefact ist kein Notrufsystem. Ohne Netz oder Akku wird kein Standort übertragen. Im Notfall die örtliche Notrufnummer wählen (in Europa 112).',map:'Karte',err:'Verbindungsproblem – neuer Versuch …'};
if(EN)document.documentElement.lang='en';
function f(s,a){return s.replace('{0}',a)}
function $(i){return document.getElementById(i)}
$('lvNote').textContent=TX.note;$('map').setAttribute('aria-label',TX.map);
var key=(location.hash||'').replace(/^#/,'');
var map=null,mk=null,an=null,skew=0,last=null,tm=0;
function initMap(){if(map||!window.L)return;map=L.map('map',{zoomControl:true,attributionControl:true}).setView([47.5,13.5],5);
  L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,subdomains:'abc',attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · © <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)'}).addTo(map)}
function move(lat,lon,old){initMap();if(!map)return;var ic=L.divIcon({className:'',html:'<div class="dot'+(old?' old':'')+'"></div>',iconSize:[20,20],iconAnchor:[10,10]});
  if(!mk){mk=L.marker([lat,lon],{icon:ic,keyboard:false}).addTo(map);map.setView([lat,lon],15);return}
  mk.setIcon(ic);var c=mk.getLatLng(),d=map.distance(c,[lat,lon]);if(d<0.5)return;
  if(d>3000||matchMedia('(prefers-reduced-motion: reduce)').matches){mk.setLatLng([lat,lon]);map.panTo([lat,lon]);return}
  var t0=performance.now(),dur=9500,a=[c.lat,c.lng],b=[lat,lon];an&&cancelAnimationFrame(an);
  (function st(t){var k=Math.min(1,(t-t0)/dur);var p=[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k];mk.setLatLng(p);if(!map.getBounds().pad(-0.2).contains(p))map.panTo(p,{animate:true});if(k<1)an=requestAnimationFrame(st)})(t0)}
function hm(iso){try{return new Date(iso).toLocaleTimeString(EN?'en-GB':'de-AT',{hour:'2-digit',minute:'2-digit'})}catch(e){return''}}
function render(j){var nm=(j&&j.name)||TX.rider;
  if(!j||!j.ok){$('lvTitle').textContent=TX.bad;$('lvSub').textContent=TX.badNote;$('lvStill').hidden=$('lvOld').hidden=true;return}
  var now=Date.parse(j.now)||Date.now();skew=Date.now()-now;
  if(!j.active){$('lvTitle').textContent=f(TX.off,nm);$('lvSub').textContent=TX.offNote;$('lvStill').hidden=$('lvOld').hidden=true;if(mk){map.removeLayer(mk);mk=null}return}
  last=j;var age=Math.max(0,Math.round((now-Date.parse(j.at))/1000));var old=age>120;
  $('lvTitle').textContent=f(TX.on,nm);
  $('lvSub').textContent=[TX.mode[j.mode]||'',f(TX.since,hm(j.started_at)),f(TX.last,TX.ago(age))].filter(Boolean).join(' · ');
  $('lvOld').hidden=!old;if(old)$('lvOld').textContent=f(TX.noNet,Math.round(age/60));
  var st=j.still_since&&!old?Math.max(2,Math.round((now-Date.parse(j.still_since))/60000)):0;$('lvStill').hidden=!st;if(st)$('lvStill').textContent='⏸ '+f(TX.still,st);
  move(j.lat,j.lon,old)}
function tick(){if(!key){render(null);return}
  fetch(SB+'/rest/v1/rpc/live_view',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({p_key:key}),cache:'no-store',referrerPolicy:'no-referrer'})
   .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(render).catch(function(){if(!last){$('lvTitle').textContent=TX.err}})
   .then(function(){clearTimeout(tm);tm=setTimeout(tick,document.hidden?30000:10000)})}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&last){clearTimeout(tm);tick()}});
initMap();tick();
})();
</script>
</body>
</html>
