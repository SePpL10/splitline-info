<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Linefact Admin</title>
<style>
:root{color-scheme:light;
  --page:#f4f5f2;--surface:#ffffff;--surface-2:#f2f3ef;--ink:#121418;--ink-2:#52575e;--muted:#868b91;--line:#e3e4df;--axis:#c6c8c2;
  --accent:#1e50ff;--accent-ink:#ffffff;--series:#2a78d6;--series-wash:rgba(42,120,214,.10);
  --good:#0ca30c;--good-ink:#006300;--warn:#fab219;--crit:#d03b3b;--ring:rgba(18,20,24,.08);--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --page:#0e0f11;--surface:#17191d;--surface-2:#202329;--ink:#f0f1f2;--ink-2:#c1c4c9;--muted:#8c9096;--line:#2a2d33;--axis:#3a3e45;
  --accent:#5b7fff;--accent-ink:#ffffff;--series:#3987e5;--series-wash:rgba(57,135,229,.14);--good-ink:#0ca30c;--ring:rgba(255,255,255,.08);--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;
  --page:#0e0f11;--surface:#17191d;--surface-2:#202329;--ink:#f0f1f2;--ink-2:#c1c4c9;--muted:#8c9096;--line:#2a2d33;--axis:#3a3e45;
  --accent:#5b7fff;--accent-ink:#ffffff;--series:#3987e5;--series-wash:rgba(57,135,229,.14);--good-ink:#0ca30c;--ring:rgba(255,255,255,.08);--shadow:none}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;min-height:36px}
button:hover{background:var(--surface-2)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.danger{color:var(--crit)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:38px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.logo{width:34px;height:34px;border-radius:9px;background:#1E50FF;display:grid;place-items:center;flex:none;overflow:hidden}
.logo svg{width:100%;height:100%}
.brand{font-weight:750;font-size:1.25rem;letter-spacing:-.01em}
.brand small{font-weight:500;color:var(--muted);font-size:.85rem;margin-left:6px}
.sp{flex:1}
.stamp{color:var(--muted);font-size:.85rem}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;border-radius:999px;min-height:30px;padding:4px 14px;background:transparent;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.grid{display:grid;gap:14px}
.g-hero{grid-template-columns:minmax(260px,1.2fr) repeat(3,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:980px){.g-hero{grid-template-columns:repeat(2,minmax(0,1fr))}.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.g-hero,.g3{grid-template-columns:1fr 1fr}.g-hero .hero{grid-column:1/-1}.g2{grid-template-columns:1fr}.g6{grid-template-columns:1fr 1fr}.tile .val{font-size:1.5rem}.tile .hint{font-size:.72rem}}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--ring);padding:16px;min-width:0}
.card h2{font-size:.95rem;margin:0 0 2px;font-weight:650}
.card .sub{color:var(--muted);font-size:.82rem;margin:0 0 10px}
.chead{display:flex;align-items:flex-start;gap:8px}
.chead .sp{flex:1}
.tbtn{min-height:28px;padding:3px 10px;font-size:.78rem;border-radius:999px;color:var(--ink-2)}
.hero .lbl{color:var(--ink-2);font-size:.9rem}
.hero .big{font-size:3.4rem;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin:4px 0}
.delta{font-size:.85rem;color:var(--good-ink);font-weight:600}
.delta.zero{color:var(--muted);font-weight:500}
.tile .lbl{color:var(--ink-2);font-size:.85rem}
.tile .val{font-size:1.9rem;font-weight:650;letter-spacing:-.01em;margin-top:2px}
.tile .hint{color:var(--muted);font-size:.78rem}
.tile.alert{border-color:color-mix(in srgb,var(--crit) 45%,transparent)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:650;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.badge.crit{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}
.badge.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good-ink)}
.mini{display:flex;flex-direction:column;gap:2px;padding:12px 14px}
.mini .val{font-size:1.35rem;font-weight:650}
.mini .lbl{color:var(--ink-2);font-size:.8rem}
section{margin-top:22px}
section>h3,section>.chead h3{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--axis);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.chart .lab{fill:var(--ink);font-weight:650;font-size:12px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.12);padding:7px 10px;font-size:.8rem;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .1s;z-index:5}
.tip b{display:block;font-size:.95rem}
.tip span{color:var(--muted)}
.tip.on{opacity:1}
.hbar{display:grid;grid-template-columns:minmax(80px,auto) 1fr auto;gap:6px 10px;align-items:center;font-size:.85rem}
.hbar .t{height:12px;border-radius:0 4px 4px 0;background:var(--series);min-width:2px}
.hbar .n{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.hbar .k{color:var(--ink-2)}
.meter{margin:10px 0 14px}
.meter .row{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:5px}
.meter .row span{color:var(--muted)}
.meter .tr{height:10px;border-radius:999px;background:color-mix(in srgb,var(--series) 18%,transparent);overflow:hidden}
.meter .fl{height:100%;border-radius:999px;background:var(--series)}
.meter .fl.warn{background:var(--warn)}.meter .fl.crit{background:var(--crit)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;font-weight:600;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.lgrp h4{margin:0 0 6px;font-size:.85rem}
.lgrp a{display:flex;align-items:center;justify-content:space-between;gap:8px;text-decoration:none;color:var(--ink);padding:8px 10px;border-radius:10px;background:var(--surface-2);margin-bottom:6px;font-size:.88rem}
.lgrp a:hover{background:color-mix(in srgb,var(--accent) 10%,var(--surface-2))}
.lgrp a span{color:var(--muted);font-size:.8rem}
.rep{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:6px}
.rep:first-child{border-top:0}
.rep .meta{color:var(--muted);font-size:.8rem}
.rep .why{font-weight:600}
.rep .ctx{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:.85rem;word-break:break-word}
.rep .acts{display:flex;gap:6px;flex-wrap:wrap}
.annl{display:flex;flex-direction:column;gap:4px;margin:8px 0;font-size:.85rem;font-weight:600}
.anin{width:100%;font:inherit;font-weight:400;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.anntb{display:flex;gap:6px;margin:4px 0}.anntb .tbtn{min-width:36px;font-weight:800}
.annprev{margin-top:12px}.apcard{max-width:380px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#1E50FF,#1438C8);color:#fff;margin-top:6px}
.apbar{display:flex;gap:10px;align-items:center;padding:12px 14px 0}.apbar .apav{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-weight:800}
.apbar b{display:block;letter-spacing:.08em;font-size:.9rem}.apbar small{opacity:.85;font-size:.75rem}
.apcard img{display:block;width:100%;max-height:300px;object-fit:cover;margin-top:10px}.apbody{padding:10px 14px 14px;display:flex;flex-direction:column;gap:6px}.apbody h3{margin:0;font-size:1.1rem;color:#fff}
.aptext p,.aptext ul,.aptext h4{margin:0 0 6px}.aptext a{color:#fff}.apbtn{align-self:flex-start;background:#fff;color:#1E50FF;border-radius:999px;padding:7px 14px;font-weight:800}
.rep .ctx p,.rep .ctx ul,.rep .ctx h4{margin:0 0 4px}
.anta{width:100%;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
.clubnm b{display:block}.clubst{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:5px}.clubmsg{margin:0 0 10px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--good) 12%,transparent);font-size:.86rem}
.tbtn.on{background:color-mix(in srgb,var(--good) 14%,transparent)}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.err{color:var(--crit)}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.login .card{padding:22px}
.login label{display:block;font-size:.85rem;color:var(--ink-2);margin:12px 0 4px}
.login input{width:100%}
.login button{width:100%;margin-top:16px}
.loading{opacity:.55;transition:opacity .2s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ok{color:var(--good-ink)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// =====================================================================
// Linefact Admin – Übersicht über Nutzer, Nutzung, Inhalte und Meldungen.
// Anmeldung mit deinem Linefact-Konto (E-Mail + Passwort). Daten gibt es nur,
// wenn in Supabase bei deinem Profil is_admin = true gesetzt ist.
// =====================================================================
const CFG={
  sbUrl:'https://pgkkbzozlufbzcdtkbrb.supabase.co',
  sbKey:'sb_publishable_oizBlM6hGJoDkOjSbtd9Aw_ydfWCJRb',
  mail:'linefact.main@gmail.com',
  links:[
    {g:'GitHub',items:[['App (iPhone)','https://github.com/SePpL10/Splitline-Beta','Repo'],['Apple-Watch-App','https://github.com/SePpL10/Linefact-Watch','Repo'],['Webseite','https://github.com/SePpL10/splitline-info','Repo']]},
    {g:'Supabase (Datenbank)',items:[['Projekt','https://supabase.com/dashboard/project/pgkkbzozlufbzcdtkbrb','Übersicht'],['Tabellen','https://supabase.com/dashboard/project/pgkkbzozlufbzcdtkbrb/editor','Editor'],['SQL Editor','https://supabase.com/dashboard/project/pgkkbzozlufbzcdtkbrb/sql/new','Neu'],['Konten','https://supabase.com/dashboard/project/pgkkbzozlufbzcdtkbrb/auth/users','Auth'],['Fotos','https://supabase.com/dashboard/project/pgkkbzozlufbzcdtkbrb/storage/buckets','Storage'],['Logs','https://supabase.com/dashboard/project/pgkkbzozlufbzcdtkbrb/logs/explorer','Fehler']]},
    {g:'Bauen & Apple',items:[['Codemagic','https://codemagic.io/apps','Builds'],['App Store Connect','https://appstoreconnect.apple.com/apps','Apps'],['Apple Developer','https://developer.apple.com/account/resources/identifiers/list','IDs']]},
    {g:'Karten & Web',items:[['Mapbox Konto','https://account.mapbox.com/','Token'],['Mapbox Statistik','https://account.mapbox.com/statistics/','Abrufe'],['Webseite','https://seppl10.github.io/splitline-info/','Live'],['Datenschutz','https://seppl10.github.io/splitline-info/#datenschutz','Seite']]}
  ]
};
const $=s=>document.querySelector(s);
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};
const NF=new Intl.NumberFormat('de-AT');const fmtN=n=>n==null?'–':NF.format(n);
const compact=n=>n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' Mio.':n>=1e4?Math.round(n/1e3)+' Tsd.':NF.format(n);
const fmtB=b=>b==null?'–':b>=1e9?(b/1e9).toFixed(2).replace('.',',')+' GB':b>=1e6?(b/1e6).toFixed(1).replace('.',',')+' MB':Math.round(b/1e3)+' kB';
const dShort=d=>{const x=new Date(d+'T12:00:00');return x.toLocaleDateString('de-AT',{day:'numeric',month:'numeric'})};
const dLong=d=>d?new Date(d).toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit',year:'numeric'}):'–';
const ss={get(k){try{return JSON.parse(sessionStorage.getItem(k))}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
let SES=ss.get('lfa_ses'),ST={days:30,data:null,users:[],q:'',reports:[],clubs:[],allRep:false};

// ---------- Supabase ----------
async function req(path,body,tok){const h={apikey:CFG.sbKey,'Content-Type':'application/json'};if(tok)h.Authorization='Bearer '+tok;
  let r;try{r=await fetch(CFG.sbUrl+path,{method:'POST',headers:h,body:JSON.stringify(body||{})})}catch(e){throw new Error('Keine Verbindung zum Server.')}
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const e=new Error((j&&(j.message||j.msg||j.error_description))||('Fehler '+r.status));e.status=r.status;e.code=j&&(j.code||j.error);throw e}return j}
async function token(){if(!SES)throw new Error('Nicht angemeldet');if(Date.now()<SES.exp-60000)return SES.at;
  const j=await req('/auth/v1/token?grant_type=refresh_token',{refresh_token:SES.rt},null);SES={at:j.access_token,rt:j.refresh_token,exp:Date.now()+j.expires_in*1000};ss.set('lfa_ses',SES);return SES.at}
async function rpc(fn,args){return req('/rest/v1/rpc/'+fn,args||{},await token())}

// ---------- Anmeldung ----------
function showLogin(msg){const a=$('#app');a.innerHTML='';const w=el('div','login'),c=el('div','card');
  const h=el('div');h.style.cssText='display:flex;align-items:center;gap:10px;margin-bottom:6px';h.append(logo(),el('div','brand','Linefact Admin'));
  const f=document.createElement('form');f.innerHTML='<label for="lm">E-Mail</label><input id="lm" type="email" autocomplete="username" required><label for="lp">Passwort</label><input id="lp" type="password" autocomplete="current-password" required><button class="primary" type="submit">Anmelden</button><p class="err" id="le" role="alert"></p>';
  c.append(h,el('p','sub','Mit deinem Linefact-Konto. Nur Konten mit Admin-Recht sehen Daten.'),f);w.append(c);a.append(w);
  if(msg)f.querySelector('#le').textContent=msg;
  f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;f.querySelector('#le').textContent='';
    try{const j=await req('/auth/v1/token?grant_type=password',{email:f.querySelector('#lm').value.trim(),password:f.querySelector('#lp').value},null);SES={at:j.access_token,rt:j.refresh_token,exp:Date.now()+j.expires_in*1000};ss.set('lfa_ses',SES);start()}
    catch(x){f.querySelector('#le').textContent=/invalid/i.test(x.message)?'E-Mail oder Passwort stimmt nicht.':x.message;b.disabled=false}}}
function logout(){ss.del('lfa_ses');SES=null;showLogin()}
function logo(){const d=el('div','logo');d.innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="2.2"><path d="M50 16 C71 14 86 30 84 51 C82 72 65 86 46 84 C25 82 14 65 18 46 C21 29 33 17 50 16 Z" stroke-opacity=".18"/><path d="M50 29 C64 28 73 38 72 51 C71 63 61 72 48 71 C35 70 28 61 30 48 C32 37 40 30 50 29 Z" stroke-opacity=".27"/><path d="M50 41 C56 41 60 45 60 50 C60 56 55 60 49 59 C44 58 41 54 42 49 C43 44 46 41 50 41 Z" stroke-opacity=".38"/></g><path d="M21 79 79 21" stroke="#fff" stroke-width="8.5" stroke-linecap="round"/><circle cx="50" cy="50" r="5.4" fill="#121418"/></svg>';return d}

// ---------- Laden ----------
async function start(){if(!SES){showLogin();return}
  try{const p=await rpc('get_my_profile',{});if(!p||!p[0]||!p[0].is_admin){showLogin('Dieses Konto hat kein Admin-Recht. In Supabase › Tabellen › profiles bei deinem Konto is_admin = true setzen.');ss.del('lfa_ses');SES=null;return}ST.me=p[0]}
  catch(e){if(e.status===400||e.status===401){logout();return}showLogin(e.message);return}
  shell();await loadAll()}
async function loadAll(){const m=$('#main');if(m)m.classList.add('loading');
  try{const[o,d,u,r,c,an,ch]=await Promise.all([rpc('admin_overview'),rpc('admin_daily',{p_days:ST.days}),rpc('admin_users',{p_query:ST.q,p_limit:200}),rpc('admin_reports',{p_all:ST.allRep}),rpc('admin_clubs'),rpc('get_announcements',{p_limit:20}).catch(()=>[]),rpc('admin_challenges').catch(()=>null)]);
    ST.o=o;ST.d=d||[];ST.users=u||[];ST.reports=r||[];ST.clubs=c||[];ST.ann=an||[];ST.chal=ch;ST.err='';ST.at=new Date()}
  catch(e){ST.err=e.code==='PGRST202'?'Die Datenbank ist nicht aktuell: Bitte die neue SQL-Datei in Supabase ausführen.':e.message}
  render();if(m)m.classList.remove('loading')}

// ---------- Seite ----------
function shell(){const a=$('#app');a.innerHTML='';const w=el('div','wrap');
  const h=el('header','top');const b=el('div','brand','Linefact');b.append(el('small',null,'Admin'));
  const st=el('span','stamp');st.id='stamp';const rf=el('button',null,'Aktualisieren');rf.onclick=loadAll;const th=el('button',null,'Hell/Dunkel');th.setAttribute('aria-label','Hell oder dunkel umschalten');
  th.onclick=()=>{const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark';try{localStorage.setItem('lfa_theme',r.dataset.theme)}catch(e){};render()};
  const lo=el('button',null,'Abmelden');lo.onclick=logout;h.append(logo(),b,el('span','sp'),st,rf,th,lo);
  const f=el('div','filters');f.append(el('span','stamp','Zeitraum'));const sg=el('div','seg');sg.setAttribute('role','group');sg.setAttribute('aria-label','Zeitraum');
  [[7,'7 Tage'],[30,'30 Tage'],[90,'90 Tage'],[365,'1 Jahr']].forEach(([n,t])=>{const x=el('button',null,t);x.type='button';x.setAttribute('aria-pressed',String(ST.days===n));x.onclick=()=>{ST.days=n;sg.querySelectorAll('button').forEach(y=>y.setAttribute('aria-pressed',String(y===x)));loadAll()};sg.append(x)});f.append(sg);
  const m=el('main');m.id='main';w.append(h,f,m);a.append(w)}
function render(){const m=$('#main');if(!m)return;m.innerHTML='';$('#stamp').textContent=ST.at?'Stand '+ST.at.toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'}):'';
  if(ST.err){const c=el('div','card');c.append(el('p','err',ST.err));m.append(c);m.append(linksSec());return}
  const o=ST.o,D=ST.d,sum=k=>D.reduce((s,x)=>s+(x[k]||0),0);
  // Kopf: Nutzer + Aktivität
  const g=el('div','grid g-hero');
  const hero=el('div','card hero');hero.append(el('div','lbl','Nutzer mit Konto'),el('div','big',fmtN(o.users)));const dl=el('div','delta'+(o.users_7?'':' zero'),(o.users_7?'+'+fmtN(o.users_7):'±0')+' in 7 Tagen · +'+fmtN(o.users_30)+' in 30 Tagen');hero.append(dl);
  g.append(hero,tile('Heute aktiv',o.dau,'Nutzer, die die App heute geöffnet haben'),tile('Aktiv in 7 Tagen',o.wau,'verschiedene Nutzer'),tile('Aktiv in 30 Tagen',o.mau,o.users?Math.round(o.mau/o.users*100)+' % aller Konten':''));m.append(g);
  const g2=el('div','grid g3');g2.style.marginTop='14px';
  g2.append(tile('App-Starts (30 Tage)',o.opens_30,o.mau?'Ø '+(o.opens_30/o.mau).toFixed(1).replace('.',',')+' je aktivem Nutzer':''),tile('Ø aktive Tage je Nutzer',o.active_days_30,'in den letzten 30 Tagen',true),repTile(o.reports_open));m.append(g2);

  const hit=mk('rect',{x:L,y:0,width:pw,height:H,fill:'transparent',tabindex:0});box.append(sv);const tip=el('div','tip');box.append(tip);

function annMd(src){const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const inl=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*]+)\*/g,'$1<i>$2</i>').replace(/\[([^\]]{1,80})\]\((https:\/\/[^\s)]{1,300})\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out=[];let list=null,para=[];const flush=()=>{if(para.length){out.push('<p>'+para.map(inl).join('<br>')+'</p>');para=[]}if(list){out.push('<ul>'+list.map(x=>'<li>'+inl(x)+'</li>').join('')+'</ul>');list=null}};
  String(src||'').split(/\r?\n/).forEach(l=>{const t=l.trim();if(!t){flush();return}const h=t.match(/^#{1,3}\s+(.+)/);if(h){flush();out.push('<h4>'+inl(h[1])+'</h4>');return}
    const li=t.match(/^[-•*]\s+(.+)/);if(li){if(para.length){out.push('<p>'+para.map(inl).join('<br>')+'</p>');para=[]}(list=list||[]).push(li[1]);return}if(list){out.push('<ul>'+list.map(x=>'<li>'+inl(x)+'</li>').join('')+'</ul>');list=null}para.push(t)});
  flush();return out.join('')}
// Bild verkleinern: max. 1200 px breit, JPEG, höchstens ca. 600 KB
function annImage(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Dieses Bild geht nicht.'))};
  im.onload=()=>{URL.revokeObjectURL(u);let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,1200/w,1600/h);w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
    for(const q of [.85,.75,.65,.55,.45]){const d=c.toDataURL('image/jpeg',q);if(d.length<=850000){res(d);return}}rej(new Error('Das Bild ist zu groß.'))};im.src=u})}
const ANN={img:null};
function annSec(){const s=el('section');s.append(el('h3',null,'Offizielle Beiträge'));const c=el('div','card');
  c.append(el('p','sub','Erscheinen bei allen angemeldeten Nutzern als blauer Banner unter Aktivität › Alle (die ersten 7 Tage oben angeheftet). Jeder kann einen Beitrag mit ✕ für sich ausblenden.'));
  const lab=(t,inp)=>{const l=el('label','annl');l.append(el('span',null,t),inp);return l};
  const ti=el('input');ti.type='text';ti.maxLength=120;ti.placeholder='Titel (freiwillig), z. B. „Neu in Version 1.0.49“';ti.className='anin';
  const tb=el('div','anntb');const ta=document.createElement('textarea');ta.rows=7;ta.maxLength=4000;ta.placeholder='Text …\n\n**fett**, *kursiv*\n## Zwischenüberschrift\n- Aufzählung\n[Linktext](https://…)';ta.setAttribute('aria-label','Text des offiziellen Beitrags');ta.className='anta';
  const wrap=(a,b,ph)=>{const st=ta.selectionStart,en=ta.selectionEnd,sel=ta.value.slice(st,en)||ph;ta.setRangeText(a+sel+b,st,en,'select');ta.focus();prev()};
  const line=(p)=>{const st=ta.selectionStart;const ls=ta.value.lastIndexOf('\n',st-1)+1;ta.setRangeText(p,ls,ls,'end');ta.focus();prev()};
  [['B','Fett',()=>wrap('**','**','fett')],['I','Kursiv',()=>wrap('*','*','kursiv')],['H','Zwischenüberschrift',()=>line('## ')],['•','Aufzählung',()=>line('- ')],['🔗','Link',()=>{const u=prompt('Link (muss mit https:// beginnen):','https://');if(!u||!/^https:\/\//.test(u))return;wrap('[','](' + u + ')','Linktext')}]].forEach(([t,l,f])=>{const b=el('button','tbtn',t);b.type='button';b.title=l;b.setAttribute('aria-label',l);b.onclick=f;tb.append(b)});
  const fi=el('input');fi.type='file';fi.accept='image/*';fi.className='anin';const imgInfo=el('span','sub');const imgX=el('button','tbtn','Bild entfernen');imgX.type='button';imgX.hidden=!ANN.img;
  fi.onchange=async()=>{const f=fi.files&&fi.files[0];if(!f)return;imgInfo.textContent='Wird verkleinert …';try{ANN.img=await annImage(f);imgInfo.textContent='Bild bereit ('+Math.round(ANN.img.length*3/4/1024)+' KB)';imgX.hidden=false}catch(e){ANN.img=null;imgInfo.textContent=e.message}prev()};
  imgX.onclick=()=>{ANN.img=null;fi.value='';imgInfo.textContent='';imgX.hidden=true;prev()};
  const lt=el('input');lt.type='text';lt.maxLength=40;lt.placeholder='Knopf-Text, z. B. „Zu Instagram“';lt.className='anin';
  const lu=el('input');lu.type='url';lu.maxLength=300;lu.placeholder='https://…';lu.className='anin';
  const pv=el('div','annprev');
  const prev=()=>{pv.innerHTML='';const card=el('div','apcard');const bar=el('div','apbar');bar.innerHTML='<span class="apav">L</span><span><b>LINEFACT</b><small>Offizielle Mitteilung · gerade eben</small></span>';card.append(bar);
    if(ANN.img){const im=document.createElement('img');im.src=ANN.img;im.alt='';card.append(im)}const bd=el('div','apbody');if(ti.value.trim())bd.append(el('h3',null,ti.value.trim()));
    if(ta.value.trim()){const d=el('div','aptext');d.innerHTML=annMd(ta.value);bd.append(d)}if(/^https:\/\//.test(lu.value.trim())){const a=el('span','apbtn',lt.value.trim()||'Mehr erfahren');bd.append(a)}card.append(bd);
    pv.append(el('div','sub','Vorschau (so sieht es in der App aus):'),card)};
  [ti,ta,lt,lu].forEach(x=>x.addEventListener('input',prev));
  const go=el('button','primary','Veröffentlichen');go.type='button';const info=el('p','sub');
  const pl=el('label');pl.style.cssText='display:flex;gap:8px;align-items:center;margin:8px 0 0;font-size:.92rem';const pc=document.createElement('input');pc.type='checkbox';pc.id='annPush';pl.append(pc,document.createTextNode('Auch als Push-Mitteilung schicken (höchstens 1× pro Tag; Titel + die ersten 150 Zeichen)'));
  go.onclick=async()=>{const t=ta.value.trim(),tt=ti.value.trim(),u=lu.value.trim();info.textContent='';
    if(!t&&!tt){info.textContent='Bitte einen Titel oder Text schreiben.';return}if(u&&!/^https:\/\//.test(u)){info.textContent='Der Link muss mit https:// beginnen.';return}
    if(!confirm(pc.checked?'Diesen Beitrag an alle Nutzer veröffentlichen UND als Push-Mitteilung schicken?':'Diesen Beitrag an alle Nutzer veröffentlichen?'))return;go.disabled=true;
    try{await rpc('admin_post_announcement',{p_text:t,p_push:pc.checked,p_title:tt||null,p_image:ANN.img,p_link:u||null,p_link_text:lt.value.trim()||null});ANN.img=null;await loadAll()}
    catch(e){info.textContent=/push_limit/.test(e.message)?'Heute wurde schon eine Push-Mitteilung geschickt. Ohne Haken geht es sofort, mit Haken morgen wieder.':/image_invalid/.test(e.message)?'Das Bild geht nicht.':/link_invalid/.test(e.message)?'Der Link muss mit https:// beginnen.':e.message;go.disabled=false}};
  const row=el('div');row.style.cssText='display:flex;gap:8px;align-items:center;margin:8px 0 4px';row.append(go,info);
  const imgRow=el('div');imgRow.style.cssText='display:flex;gap:8px;align-items:center;flex-wrap:wrap';imgRow.append(fi,imgX,imgInfo);
  const lnk=el('div');lnk.style.cssText='display:grid;grid-template-columns:1fr 2fr;gap:8px';lnk.append(lab('Knopf-Text',lt),lab('Knopf-Link',lu));
  c.append(lab('Titel',ti),el('div','sub','Text'),tb,ta,lab('Bild (freiwillig, wird verkleinert)',imgRow),lnk,pl,row,pv);prev();
  if(!(ST.ann||[]).length)c.append(el('p','empty','Noch keine offiziellen Beiträge.'));
  (ST.ann||[]).forEach(a=>{const d=el('div','rep');d.append(el('div','meta',new Date(a.created_at).toLocaleString('de-AT')+(a.link_url?' · Knopf: '+(a.link_text||'Mehr erfahren')+' → '+a.link_url:'')));
    if(a.title)d.append(el('b',null,a.title));if(a.image){const im=document.createElement('img');im.src=a.image;im.alt='';im.style.cssText='max-width:220px;border-radius:10px';d.append(im)}
    if(a.body){const x=el('div','ctx');x.innerHTML=annMd(a.body);d.append(x)}const ac=el('div','acts');ac.append(btnA('Löschen','danger',()=>act('admin_delete_announcement',{p_id:a.id}),'Diesen Beitrag für alle löschen?'));d.append(ac);c.append(d)});
  s.append(c);return s}


// ---------- Challenges für alle Nutzer ----------
function chalSec(){const s=el('section');s.append(el('h3',null,'Challenges für alle'));const c=el('div','card');
  if(ST.chal==null){c.append(el('p','sub','Die Datenbank ist noch nicht auf 1.0.51 – bitte die neue SQL-Datei in Supabase ausführen.'));s.append(c);return s}
  c.append(el('p','sub','Erscheint bei allen angemeldeten Nutzern unter Aktivität › Alle als „Challenge von Linefact“. Mitmachen per Knopf; der Fortschritt kommt aus ihren Fahrten. Wer es schafft, bekommt ein Abzeichen im Profil. „Zeit schlagen“ gibt es nur in Clubs bzw. von Person zu Person (es braucht eine gemeinsame Strecke).'));
  const lab=(t,inp)=>{const l=el('label','annl');l.append(el('span',null,t),inp);return l};
  const kind=document.createElement('select');kind.className='anin';[['rides','Fahrtage (Tage, an denen gefahren wurde)'],['km','Kilometer'],['laps','Motocross-Runden']].forEach(([v,t])=>kind.append(new Option(t,v)));
  const mode=document.createElement('select');mode.className='anin';[['','Alle Fahrten'],['mx','Nur Motocross'],['enduro','Nur Enduro']].forEach(([v,t])=>mode.append(new Option(t,v)));
  const goal=el('input');goal.type='number';goal.min='1';goal.className='anin';goal.placeholder='z. B. 10';
  const ends=el('input');ends.type='date';ends.className='anin';{const d=new Date();const e=new Date(d.getFullYear(),d.getMonth()+1,0);ends.value=e.getFullYear()+'-'+String(e.getMonth()+1).padStart(2,'0')+'-'+String(e.getDate()).padStart(2,'0')}
  const ti=el('input');ti.type='text';ti.maxLength=80;ti.className='anin';ti.placeholder='z. B. 10 Fahrtage im November';
  const no=document.createElement('textarea');no.rows=2;no.maxLength=300;no.className='anin';no.placeholder='Beschreibung (freiwillig)';
  const upd=()=>{mode.disabled=kind.value==='laps'};kind.onchange=upd;upd();
  const g1=el('div');g1.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px';g1.append(lab('Art',kind),lab('Welche Fahrten',mode),lab('Ziel',goal),lab('Läuft bis',ends));
  const go=el('button','primary','Challenge für alle posten');go.type='button';const info=el('p','sub');
  go.onclick=async()=>{info.textContent='';const gv=+goal.value,t=ti.value.trim();if(!(gv>0)){info.textContent='Bitte ein Ziel eingeben.';return}if(t.length<2){info.textContent='Bitte einen Titel eingeben.';return}
    const e=new Date(ends.value+'T23:59:00');if(isNaN(e)||e<new Date()){info.textContent='Das Ende muss in der Zukunft liegen.';return}
    if(!confirm('Diese Challenge an alle Nutzer posten?'))return;go.disabled=true;
    try{await rpc('create_challenge',{p:{audience:'all',kind:kind.value,goal:gv,mode:kind.value==='laps'?null:(mode.value||null),title:t,note:no.value.trim(),ends:e.toISOString()}});await loadAll()}
    catch(x){info.textContent=/goal_invalid/.test(x.message)?'Das Ziel passt nicht.':/time_invalid/.test(x.message)?'Das Ende passt nicht (höchstens ein Jahr).':x.message;go.disabled=false}};
  const row=el('div');row.style.cssText='display:flex;gap:8px;align-items:center;margin:8px 0 4px';row.append(go,info);
  c.append(lab('Titel',ti),g1,no,row);
  if(!ST.chal.length)c.append(el('p','empty','Noch keine Challenge für alle.'));
  const U={rides:'Fahrtage',km:'km',laps:'Runden'};
  ST.chal.forEach(x=>{const d=el('div','rep');const ended=new Date(x.ends_at)<new Date();d.append(el('div','meta',new Date(x.created_at).toLocaleDateString('de-AT')+' · bis '+new Date(x.ends_at).toLocaleDateString('de-AT')+(ended?' · vorbei':'')));
    d.append(el('b',null,x.title));d.append(el('div','ctx','Ziel: '+(+x.goal)+' '+(U[x.kind]||'')+(x.mode?' ('+(x.mode==='mx'?'Motocross':'Enduro')+')':'')+' · '+x.participants+' dabei · '+x.finishers+' geschafft'));
    const ac=el('div','acts');ac.append(btnA('Löschen','danger',()=>act('delete_challenge',{p_id:x.id}),'Diese Challenge für alle löschen? Abzeichen gehen verloren.'));d.append(ac);c.append(d)});
  s.append(c);return s}

// ---------- Schnellzugriff ----------
function linksSec(){const s=el('section');s.append(el('h3',null,'Schnellzugriff'));const c=el('div','card');const g=el('div','links');
  CFG.links.forEach(L=>{const d=el('div','lgrp');d.append(el('h4',null,L.g));L.items.forEach(([t,u,h])=>{const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';a.append(document.createTextNode(t),el('span',null,h+' ↗'));d.append(a)});g.append(d)});
  const d=el('div','lgrp');d.append(el('h4',null,'Kontakt'));const a=document.createElement('a');a.href='mailto:'+CFG.mail;a.append(document.createTextNode('Support-Postfach'),el('span',null,CFG.mail));d.append(a);g.append(d);c.append(g);s.append(c);return s}

try{const t=localStorage.getItem('lfa_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
let rT;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{if(ST.o)render()},200)});
start();
