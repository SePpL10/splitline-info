<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Linefact Admin</title>
<style>
:root{color-scheme:light;
  --page:#f4f5f2;--surface:#ffffff;--surface-2:#f2f3ef;--ink:#121418;--ink-2:#52575e;--muted:#868b91;--line:#e3e4df;--axis:#c6c8c2;
  --accent:#1e50ff;--accent-ink:#ffffff;--series:#2a78d6;--series-wash:rgba(42,120,214,.10);
  --good:#0ca30c;--good-ink:#006300;--warn:#fab219;--crit:#d03b3b;--ring:rgba(18,20,24,.08);--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --page:#0e0f11;--surface:#17191d;--surface-2:#202329;--ink:#f0f1f2;--ink-2:#c1c4c9;--muted:#8c9096;--line:#2a2d33;--axis:#3a3e45;
  --accent:#5b7fff;--accent-ink:#ffffff;--series:#3987e5;--series-wash:rgba(57,135,229,.14);--good-ink:#0ca30c;--ring:rgba(255,255,255,.08);--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;
  --page:#0e0f11;--surface:#17191d;--surface-2:#202329;--ink:#f0f1f2;--ink-2:#c1c4c9;--muted:#8c9096;--line:#2a2d33;--axis:#3a3e45;
  --accent:#5b7fff;--accent-ink:#ffffff;--series:#3987e5;--series-wash:rgba(57,135,229,.14);--good-ink:#0ca30c;--ring:rgba(255,255,255,.08);--shadow:none}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;min-height:36px}
button:hover{background:var(--surface-2)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.danger{color:var(--crit)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:38px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.logo{width:34px;height:34px;border-radius:9px;background:#1E50FF;display:grid;place-items:center;flex:none;overflow:hidden}
.logo svg{width:100%;height:100%}
.brand{font-weight:750;font-size:1.25rem;letter-spacing:-.01em}
.brand small{font-weight:500;color:var(--muted);font-size:.85rem;margin-left:6px}
.sp{flex:1}
.stamp{color:var(--muted);font-size:.85rem}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;border-radius:999px;min-height:30px;padding:4px 14px;background:transparent;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.grid{display:grid;gap:14px}
.g-hero{grid-template-columns:minmax(260px,1.2fr) repeat(3,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:980px){.g-hero{grid-template-columns:repeat(2,minmax(0,1fr))}.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.g-hero,.g3{grid-template-columns:1fr 1fr}.g-hero .hero{grid-column:1/-1}.g2{grid-template-columns:1fr}.g6{grid-template-columns:1fr 1fr}.tile .val{font-size:1.5rem}.tile .hint{font-size:.72rem}}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--ring);padding:16px;min-width:0}
.card h2{font-size:.95rem;margin:0 0 2px;font-weight:650}
.card .sub{color:var(--muted);font-size:.82rem;margin:0 0 10px}
.chead{display:flex;align-items:flex-start;gap:8px}
.chead .sp{flex:1}
.tbtn{min-height:28px;padding:3px 10px;font-size:.78rem;border-radius:999px;color:var(--ink-2)}
.hero .lbl{color:var(--ink-2);font-size:.9rem}
.hero .big{font-size:3.4rem;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin:4px 0}
.delta{font-size:.85rem;color:var(--good-ink);font-weight:600}
.delta.zero{color:var(--muted);font-weight:500}
.tile .lbl{color:var(--ink-2);font-size:.85rem}
.tile .val{font-size:1.9rem;font-weight:650;letter-spacing:-.01em;margin-top:2px}
.tile .hint{color:var(--muted);font-size:.78rem}
.tile.alert{border-color:color-mix(in srgb,var(--crit) 45%,transparent)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:650;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.badge.crit{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}
.badge.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good-ink)}
.mini{display:flex;flex-direction:column;gap:2px;padding:12px 14px}
.mini .val{font-size:1.35rem;font-weight:650}
.mini .lbl{color:var(--ink-2);font-size:.8rem}
section{margin-top:22px}
section>h3,section>.chead h3{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--axis);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.chart .lab{fill:var(--ink);font-weight:650;font-size:12px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.12);padding:7px 10px;font-size:.8rem;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .1s;z-index:5}
.tip b{display:block;font-size:.95rem}
.tip span{color:var(--muted)}
.tip.on{opacity:1}
.hbar{display:grid;grid-template-columns:minmax(80px,auto) 1fr auto;gap:6px 10px;align-items:center;font-size:.85rem}
.hbar .t{height:12px;border-radius:0 4px 4px 0;background:var(--series);min-width:2px}
.hbar .n{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.hbar .k{color:var(--ink-2)}
.meter{margin:10px 0 14px}
.meter .row{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:5px}
.meter .row span{color:var(--muted)}
.meter .tr{height:10px;border-radius:999px;background:color-mix(in srgb,var(--series) 18%,transparent);overflow:hidden}
.meter .fl{height:100%;border-radius:999px;background:var(--series)}
.meter .fl.warn{background:var(--warn)}.meter .fl.crit{background:var(--crit)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;font-weight:600;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.lgrp h4{margin:0 0 6px;font-size:.85rem}
.lgrp a{display:flex;align-items:center;justify-content:space-between;gap:8px;text-decoration:none;color:var(--ink);padding:8px 10px;border-radius:10px;background:var(--surface-2);margin-bottom:6px;font-size:.88rem}
.lgrp a:hover{background:color-mix(in srgb,var(--accent) 10%,var(--surface-2))}
.lgrp a span{color:var(--muted);font-size:.8rem}
.rep{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:6px}
.rep:first-child{border-top:0}
.rep .meta{color:var(--muted);font-size:.8rem}
.rep .why{font-weight:600}
.rep .ctx{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:.85rem;word-break:break-word}
.rep .acts{display:flex;gap:6px;flex-wrap:wrap}
.annl{display:flex;flex-direction:column;gap:4px;margin:8px 0;font-size:.85rem;font-weight:600}
.anin{width:100%;font:inherit;font-weight:400;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
a.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
.mfaqr{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin:10px 0}.mfaqr img{width:180px;height:180px;background:#fff;border-radius:12px;padding:8px}
.mfacode{font:600 1.4rem/1.2 ui-monospace,Menlo,monospace;letter-spacing:.3em;text-align:center;max-width:220px}
.secret{font:500 .85rem ui-monospace,Menlo,monospace;word-break:break-all;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:inline-block}
.okline{color:var(--good,#1a7f37);font-weight:700}.ampel{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.anntb{display:flex;gap:6px;margin:4px 0}.anntb .tbtn{min-width:36px;font-weight:800}
.annprev{margin-top:12px}.apcard{max-width:380px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#1E50FF,#1438C8);color:#fff;margin-top:6px}
.apbar{display:flex;gap:10px;align-items:center;padding:12px 14px 0}.apbar .apav{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-weight:800}
.apbar b{display:block;letter-spacing:.08em;font-size:.9rem}.apbar small{opacity:.85;font-size:.75rem}
.apcard img{display:block;width:100%;max-height:300px;object-fit:cover;margin-top:10px}.apbody{padding:10px 14px 14px;display:flex;flex-direction:column;gap:6px}.apbody h3{margin:0;font-size:1.1rem;color:#fff}
.aptext p,.aptext ul,.aptext h4{margin:0 0 6px}.aptext a{color:#fff}.apbtn{align-self:flex-start;background:#fff;color:#1E50FF;border-radius:999px;padding:7px 14px;font-weight:800}
.rep .ctx p,.rep .ctx ul,.rep .ctx h4{margin:0 0 4px}
.anta{width:100%;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
.chlist{display:flex;flex-direction:column;gap:4px;padding:8px 10px;border-radius:10px;background:var(--surface-2);font-size:.85rem}.chlist ol{margin:0 0 6px;padding-left:22px}.chlist li{display:flex;justify-content:space-between;gap:10px}.chlist .meta{color:var(--muted)}
.uacts{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}.banmsg{color:var(--crit);font-size:.8rem;font-weight:650;margin-top:3px}
.modl{display:flex;flex-direction:column}.modl .rep .ctx{white-space:pre-wrap;word-break:break-word}
.clubnm b{display:block}.clubst{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:5px}.clubmsg{margin:0 0 10px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--good) 12%,transparent);font-size:.86rem}
.tbtn.on{background:color-mix(in srgb,var(--good) 14%,transparent)}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.err{color:var(--crit)}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.login .card{padding:22px}
.login label{display:block;font-size:.85rem;color:var(--ink-2);margin:12px 0 4px}
.login input{width:100%}
.login button{width:100%;margin-top:16px}
.loading{opacity:.55;transition:opacity .2s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ok{color:var(--good-ink)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// =====================================================================
// Linefact Admin – Übersicht über Nutzer, Nutzung, Inhalte und Meldungen.
// Anmeldung mit deinem Linefact-Konto (E-Mail + Passwort). Daten gibt es nur,
// wenn in Supabase bei deinem Profil is_admin = true gesetzt ist.
// =====================================================================
const CFG={
  sbUrl:'https://pgkkbzozlufbzcdtkbrb.supabase.co',
  sbKey:'sb_publishable_oizBlM6hGJoDkOjSbtd9Aw_ydfWCJRb',
  mail:'linefact.main@gmail.com',
  links:[
    {g:'GitHub',items:[['App (iPhone)','https://github.com/SePpL10/Splitline-Beta','Repo'],['Apple-Watch-App','https://github.com/SePpL10/Linefact-Watch','Repo'],['Webseite','https://github.com/SePpL10/splitline-info','Repo']]},
    {g:'Supabase (Datenbank)',items:[['Projekt','https://supabase.com/dashboard/project/pgkkbzozlufbzcdtkbrb','Übersicht'],['Tabellen','https://supabase.com/dashboard/project/pgkkbzozlufbzcdtkbrb/editor','Editor'],['SQL Editor','https://supabase.com/dashboard/project/pgkkbzozlufbzcdtkbrb/sql/new','Neu'],['Konten','https://supabase.com/dashboard/project/pgkkbzozlufbzcdtkbrb/auth/users','Auth'],['Fotos','https://supabase.com/dashboard/project/pgkkbzozlufbzcdtkbrb/storage/buckets','Storage'],['Logs','https://supabase.com/dashboard/project/pgkkbzozlufbzcdtkbrb/logs/explorer','Fehler']]},
    {g:'Bauen & Apple',items:[['Codemagic','https://codemagic.io/apps','Builds'],['App Store Connect','https://appstoreconnect.apple.com/apps','Apps'],['Apple Developer','https://developer.apple.com/account/resources/identifiers/list','IDs']]},
    {g:'Karten & Web',items:[['Mapbox Konto','https://account.mapbox.com/','Token'],['Mapbox Statistik','https://account.mapbox.com/statistics/','Abrufe'],['Webseite','https://seppl10.github.io/splitline-info/','Live'],['Datenschutz','https://seppl10.github.io/splitline-info/#datenschutz','Seite']]}
  ]
};
const $=s=>document.querySelector(s);
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};
const NF=new Intl.NumberFormat('de-AT');const fmtN=n=>n==null?'–':NF.format(n);
const compact=n=>n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' Mio.':n>=1e4?Math.round(n/1e3)+' Tsd.':NF.format(n);
const fmtB=b=>b==null?'–':b>=1e9?(b/1e9).toFixed(2).replace('.',',')+' GB':b>=1e6?(b/1e6).toFixed(1).replace('.',',')+' MB':Math.round(b/1e3)+' kB';
const dShort=d=>{const x=new Date(d+'T12:00:00');return x.toLocaleDateString('de-AT',{day:'numeric',month:'numeric'})};
const dLong=d=>d?new Date(d).toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit',year:'numeric'}):'–';
const ss={get(k){try{return JSON.parse(sessionStorage.getItem(k))}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
let SES=ss.get('lfa_ses'),ST={days:30,data:null,users:[],q:'',reports:[],clubs:[],allRep:false};

// ---------- Supabase ----------
async function req(path,body,tok){const h={apikey:CFG.sbKey,'Content-Type':'application/json'};if(tok)h.Authorization='Bearer '+tok;
  let r;try{r=await fetch(CFG.sbUrl+path,{method:'POST',headers:h,body:JSON.stringify(body||{})})}catch(e){throw new Error('Keine Verbindung zum Server.')}
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const e=new Error((j&&(j.message||j.msg||j.error_description))||('Fehler '+r.status));e.status=r.status;e.code=j&&(j.code||j.error);throw e}return j}
async function reqM(method,path,body,tok){const h={apikey:CFG.sbKey,'Content-Type':'application/json'};if(tok)h.Authorization='Bearer '+tok;
  let r;try{r=await fetch(CFG.sbUrl+path,{method,headers:h,body:method==='GET'||method==='DELETE'?undefined:JSON.stringify(body||{})})}catch(e){throw new Error('Keine Verbindung zum Server.')}
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const e=new Error((j&&(j.message||j.msg||j.error_description))||('Fehler '+r.status));e.status=r.status;e.code=j&&(j.code||j.error_code||j.error);throw e}return j}
function setSes(j){SES={at:j.access_token,rt:j.refresh_token,exp:Date.now()+j.expires_in*1000};ss.set('lfa_ses',SES)}
async function mfaVerify(fid,code){const tok=await token();const ch=await reqM('POST','/auth/v1/factors/'+fid+'/challenge',{},tok);
  const j=await reqM('POST','/auth/v1/factors/'+fid+'/verify',{challenge_id:ch.id,code:String(code).replace(/\s/g,'')},tok);if(j&&j.access_token)setSes(j);return j}
async function mfaFactors(){const u=await reqM('GET','/auth/v1/user',null,await token());return (u&&u.factors||[]).filter(f=>f.factor_type==='totp')}
async function token(){if(!SES)throw new Error('Nicht angemeldet');if(Date.now()<SES.exp-60000)return SES.at;
  const j=await req('/auth/v1/token?grant_type=refresh_token',{refresh_token:SES.rt},null);SES={at:j.access_token,rt:j.refresh_token,exp:Date.now()+j.expires_in*1000};ss.set('lfa_ses',SES);return SES.at}
async function rpc(fn,args){return req('/rest/v1/rpc/'+fn,args||{},await token())}

// ---------- Anmeldung ----------
function showLogin(msg){const a=$('#app');a.innerHTML='';const w=el('div','login'),c=el('div','card');
  const h=el('div');h.style.cssText='display:flex;align-items:center;gap:10px;margin-bottom:6px';h.append(logo(),el('div','brand','Linefact Admin'));
  const f=document.createElement('form');f.innerHTML='<label for="lm">E-Mail</label><input id="lm" type="email" autocomplete="username" required><label for="lp">Passwort</label><input id="lp" type="password" autocomplete="current-password" required><button class="primary" type="submit">Anmelden</button><p class="err" id="le" role="alert"></p>';
  c.append(h,el('p','sub','Mit deinem Linefact-Konto. Nur Konten mit Admin-Recht sehen Daten.'),f);w.append(c);a.append(w);
  if(msg)f.querySelector('#le').textContent=msg;
  f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;f.querySelector('#le').textContent='';
    try{const j=await req('/auth/v1/token?grant_type=password',{email:f.querySelector('#lm').value.trim(),password:f.querySelector('#lp').value},null);SES={at:j.access_token,rt:j.refresh_token,exp:Date.now()+j.expires_in*1000};ss.set('lfa_ses',SES);start()}
    catch(x){f.querySelector('#le').textContent=/invalid/i.test(x.message)?'E-Mail oder Passwort stimmt nicht.':x.message;b.disabled=false}}}
function logout(){ss.del('lfa_ses');SES=null;showLogin()}
function logo(){const d=el('div','logo');d.innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="2.2"><path d="M50 16 C71 14 86 30 84 51 C82 72 65 86 46 84 C25 82 14 65 18 46 C21 29 33 17 50 16 Z" stroke-opacity=".18"/><path d="M50 29 C64 28 73 38 72 51 C71 63 61 72 48 71 C35 70 28 61 30 48 C32 37 40 30 50 29 Z" stroke-opacity=".27"/><path d="M50 41 C56 41 60 45 60 50 C60 56 55 60 49 59 C44 58 41 54 42 49 C43 44 46 41 50 41 Z" stroke-opacity=".38"/></g><path d="M21 79 79 21" stroke="#fff" stroke-width="8.5" stroke-linecap="round"/><circle cx="50" cy="50" r="5.4" fill="#121418"/></svg>';return d}

// ---------- Laden ----------
async function start(){if(!SES){showLogin();return}
  try{const p=await rpc('get_my_profile',{});if(!p||!p[0]||!p[0].is_admin){showLogin('Dieses Konto hat kein Admin-Recht. In Supabase › Tabellen › profiles bei deinem Konto is_admin = true setzen.');ss.del('lfa_ses');SES=null;return}ST.me=p[0]}
  catch(e){if(e.status===400||e.status===401){logout();return}showLogin(e.message);return}
  try{ST.mfa=await rpc('admin_mfa_state',{})}catch(e){ST.mfa=null}
  if(ST.mfa&&ST.mfa.enrolled&&ST.mfa.aal!=='aal2'){showMfa();return}
  shell();await loadAll()}
function showMfa(msg){const a=$('#app');a.innerHTML='';const w=el('div','login'),c=el('div','card');
  const h=el('div');h.style.cssText='display:flex;align-items:center;gap:10px;margin-bottom:6px';h.append(logo(),el('div','brand','Linefact Admin'));
  const f=document.createElement('form');f.innerHTML='<label for="lc">Code aus der Passwörter-App (6 Ziffern)</label><input id="lc" class="mfacode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" required><button class="primary" type="submit">Bestätigen</button><p class="err" id="le" role="alert"></p>';
  const back=el('button','tbtn','Abbrechen');back.type='button';back.onclick=logout;
  c.append(h,el('p','sub','2-Faktor-Anmeldung: Öffne am iPhone Einstellungen › Passwörter (oder die App „Passwörter“) › Linefact Admin und gib den Code ein. Am iPhone schlägt Safari den Code oft direkt über der Tastatur vor.'),f,back);w.append(c);a.append(w);
  const inp=f.querySelector('#lc');inp.focus();if(msg)f.querySelector('#le').textContent=msg;

    const mi=vals.indexOf(Math.max(...vals));if(vals[mi]>0){const lb=mk('text',{x:X(mi),y:Y(vals[mi])-6,'text-anchor':'middle',class:'lab'});lb.textContent=fmtN(vals[mi])}}
  const cross=mk('line',{x1:0,x2:0,y1:T,y2:Y(0),stroke:'var(--axis)','stroke-width':1,opacity:0});const dot=kind==='line'?mk('circle',{r:4.5,fill:col,stroke:surf,'stroke-width':2,opacity:0}):null;
  const hit=mk('rect',{x:L,y:0,width:pw,height:H,fill:'transparent',tabindex:0});box.append(sv);const tip=el('div','tip');box.append(tip);

    tip.innerHTML='';tip.append(el('b',null,fmtN(vals[i])),el('span',null,new Date(D[i].day+'T12:00:00').toLocaleDateString('de-AT',{weekday:'short',day:'numeric',month:'short'})));

function mapSec(){const s=el('section');s.append(el('h3',null,'Karten (Mapbox)'));

  const rows=ST.map||[],by={};rows.forEach(x=>by[x.day]=x);const now=new Date(),ym=now.toISOString().slice(0,7);
  let mt=0,ms=0;rows.forEach(x=>{if(String(x.day).slice(0,7)===ym){mt+=+x.tiles||0;ms+=+x.statics||0}});
  const D=[];for(let i=29;i>=0;i--){const d=new Date(now.getTime()-i*864e5).toISOString().slice(0,10);const x=by[d]||{};D.push({day:d,tiles:+x.tiles||0,statics:+x.statics||0})}

    const am=el('span','ampel');am.style.background=pf>=80||p>=80?'var(--bad,#cf222e)':pf>=50||p>=50?'var(--warn,#bf8700)':'var(--good,#1a7f37)';const b=el('b');b.append(am,document.createTextNode(l));
    r.append(b,el('span',null,fmtN(v)+' von '+fmtN(lim)+' · '+Math.round(p)+' %'));const tr=el('div','tr'),fl=el('div','fl'+(p>80?' crit':p>50?' warn':''));fl.style.width=Math.max(1,p)+'%';tr.append(fl);

  c.append(el('p','sub','Grün = unter 50 %, Gelb = ab 50 %, Rot = ab 80 % (hochgerechnet). Fällt Mapbox aus, zeigt die App automatisch die freie Karte (OpenTopoMap).'));
